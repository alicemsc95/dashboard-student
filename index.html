<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel da Aluna</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4ecd8;
      color: #1f3a2e;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
    }

    h1 {
      font-size: 40px;
      color: #b87468;
      margin: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 20px;
      border-radius: 10px;
    }

    .button {
      background: #c4a24b;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      color: black;
      display: inline-block;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <div><strong>MS. ALICE</strong></div>
  <div>Camila • B1</div>
</header>

<h1>Olá, Camila.</h1>

<div class="card">
  <h2>Próxima aula</h2>
  <p>Quarta • 19h30</p>
  <p>Job Interviews — Part 2</p>
  <a class="button">Entrar na aula</a>
</div>

<div class="card">
  <h2>Objetivo</h2>
  <p>Conseguir conduzir uma entrevista em inglês até dezembro.</p>
</div>

<div class="card">
  <h2>Recado da professora</h2>
  <p>Você usou conectores novos sem perceber. Isso é evolução real.</p>
</div>

</body>
</html>
